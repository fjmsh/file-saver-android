name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Miuix XML is a git submodule and is required to build the app
          submodules: recursive

      # Miuix XML compiles with Java 21 (the app itself targets Java 17 bytecode)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Uses the Gradle version from the wrapper (gradle/wrapper/gradle-wrapper.properties)
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Verify target SDK is still 28
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -E "^package|sdkVersion|targetSdkVersion"
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -q "targetSdkVersion:'28'"

      - name: Rename APK
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          APK="dropfiler-${VERSION}-debug-${{ github.run_number }}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${APK}"
          echo "APK_NAME=${APK}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/debug/${{ env.APK_NAME }}
          if-no-files-found: error
          retention-days: 90
          archive: false
