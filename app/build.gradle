plugins {
	id 'com.android.application'
	id 'org.jetbrains.kotlin.android'
}

android {
	namespace 'fjm.sh.dropfiler'
	// compileSdk is only the API level the code is compiled against. It is raised so that
	// current AndroidX and Miuix XML can be built; it does not change runtime behaviour.
	compileSdk 36

	defaultConfig {
		applicationId "fjm.sh.dropfiler"
		// API 21 is the minimum supported by current AndroidX (appcompat 1.7) and by
		// Miuix XML after the API audit documented in README.md (previously 15).
		minSdk 21
		// NON-NEGOTIABLE: the app must keep targeting API 28 so that the legacy
		// file system storage model keeps working. Do not raise this value.
		targetSdk 28
		versionCode 37
		versionName "6.0.0"

		vectorDrawables.useSupportLibrary = true
		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
	}
	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
		// Required by Miuix XML (java.util.stream on API < 24).
		coreLibraryDesugaringEnabled true
	}
	kotlin {
		jvmToolchain(21)
		compilerOptions {
			jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
		}
	}
	testOptions {
		unitTests {
			includeAndroidResources = true
			all {
				// e.g. ./gradlew testDebugUnitTest -ProbolectricSdks=28,34 to limit API levels
				if (project.hasProperty('robolectricSdks')) {
					systemProperty 'robolectric.enabledSdks', project.property('robolectricSdks')
				}
				if (project.hasProperty('screenshots')) {
					systemProperty 'screenshotDir', layout.buildDirectory.dir('screenshots').get().asFile.path
				}
				maxHeapSize = '3g'
			}
		}
	}
	lint {
		disable 'MissingTranslation'
		// targetSdk 28 is a deliberate, documented requirement (legacy storage access).
		disable 'ExpiredTargetSdkVersion', 'OldTargetApi'
		// Gradle dependency versions are pinned deliberately (see README).
		disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion'
		textReport true
		textOutput file("$buildDir/reports/lint-results.txt")
		abortOnError true
	}
}

dependencies {
	coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

	implementation project(':HiMiuix')

	implementation 'androidx.appcompat:appcompat:1.7.1'
	implementation 'androidx.preference:preference:1.2.1'
	implementation 'androidx.recyclerview:recyclerview:1.4.0'
	implementation 'androidx.cardview:cardview:1.0.0'
	implementation 'com.google.code.gson:gson:2.8.2'

	implementation 'de.cketti.library.changelog:ckchangelog:1.2.2'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.robolectric:robolectric:4.16.1'
	testImplementation 'androidx.test:core:1.6.1'
	testImplementation 'androidx.test.ext:junit:1.2.1'
}
